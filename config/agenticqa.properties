# ---------------------------------------------------------------------------
# AgenticQA orchestrator configuration.
#
# MULTIPLE AI PROVIDERS: each provider has its own endpoint, key and models.
# To add a provider, append its id to agenticqa.llm.providers and fill a block.
# Per-provider key precedence: environment <ID>_API_KEY > apiKey below.
# ---------------------------------------------------------------------------

# AI providers (comma-separated ids; one block per provider below)
agenticqa.llm.providers=deepseek,openai

agenticqa.llm.deepseek.baseUrl=https://api.deepseek.com
agenticqa.llm.deepseek.apiKey=
agenticqa.llm.deepseek.models=deepseek-chat,deepseek-reasoner

agenticqa.llm.openai.baseUrl=https://api.openai.com/v1
agenticqa.llm.openai.apiKey=
agenticqa.llm.openai.models=gpt-4o-mini,gpt-4o

# ---------------------------------------------------------------------------
# Routing: the orchestrator decides which AI and which model per task.
# Rule format:  keyword|keyword -> provider:model
# A rule matches when ANY keyword appears in the prompt (case-insensitive);
# the first matching rule wins. When nothing matches, the default is used.
# ---------------------------------------------------------------------------
agenticqa.routing.default=deepseek:deepseek-chat
agenticqa.routing.rule.generate-test-cases=generate|test case|test cases -> deepseek:deepseek-chat
agenticqa.routing.rule.debug-failures=debug|fix|failure|failing -> deepseek:deepseek-reasoner

# ---------------------------------------------------------------------------
# Orchestrator: which project (repository path) to work on.
# Overridden per message by "--repo <path>" in the @agenticQA prompt.
# Use forward slashes in paths.
# ---------------------------------------------------------------------------
agenticqa.orchestrator.repoPath=C:/Users/Rohit Pahuja/MyProjects/youtube-demo

# RAG behaviour
agenticqa.rag.enabled=true
agenticqa.rag.topK=6
agenticqa.rag.contextTokenBudget=6000
